name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-detection:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets against baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline
          # detect-secrets always rewrites "generated_at" even when results are unchanged,
          # so ignore diffs that only touch that line to avoid false-positive CI failures.
          git diff --exit-code -I'"generated_at"' .secrets.baseline

  vulnerability-scan:
    name: Vulnerability scan (bandit SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r . -ll --confidence-level medium

  lint-flake8:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
    - name: Lint with flake8
      uses: py-actions/flake8@v2
