[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airborne_ls"]

[project]
name = "airborne-ls"
dynamic = ["version"]
description = "Calculate terrain and vegetation products from airborne laser scanner data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdal[numpy]==3.10.3",
    "laspy[lazrs]>=2.7.0",
    "numba>=0.66.0",
    "pre-commit>=4.6.1",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]

[project.scripts]
run_lidar_standardisation = "airborne_ls.scripts.run_lidar_standardisation:main"
run_tile_products = "airborne_ls.scripts.run_tile_products:main"
run_product_mosaic = "airborne_ls.scripts.run_product_mosaic:main"
run_dem_gapfill = "airborne_ls.scripts.run_dem_gapfill:main"

[[tool.uv.index]]
url = "https://gitlab.com/api/v4/projects/64206106/packages/pypi/simple"

[tool.hatch.version]
path = "src/airborne_ls/__init__.py"
