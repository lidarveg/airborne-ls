[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airborne_ls"]

[project]
name = "airborne-ls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdal[numpy]",
    "laspy[laszip,lazrs]>=2.7.0",
    "numba>=0.66.0",
    "pynninterp",
    "rios",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]

[tool.uv.sources]
pynninterp = { git = "https://gitlab.com/jrsrp/sys/lidar/pynninterp", rev = "1f912b42ff0016250b5023c043ebf152e8b8940a" }  # pragma: allowlist secret
rios = { git = "https://github.com/ubarsc/rios", rev = "7a83f73596aefe6c2bfa9373cdb83649b1f8fa8d" }  # pragma: allowlist secret
