[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airborne_ls"]

[project]
name = "airborne-ls"
dynamic = ["version"]
description = "Calculate terrain and vegetation products from airborne laser scanner data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gdal[numpy]",
    "laspy[lazrs]",
    "pyproj",
    "numba",
    "pynninterp @ git+https://gitlab.com/jrsrp/sys/lidar/pynninterp@1.0.1",
    "scipy>=1.10.0",
]

[project.scripts]
alsv_lidar_standardisation = "airborne_ls.scripts.alsv_lidar_standardisation:main"
alsv_tile_products = "airborne_ls.scripts.alsv_tile_products:main"
alsv_dem_gapfill = "airborne_ls.scripts.alsv_dem_gapfill:main"
alsv_product_mosaic = "airborne_ls.scripts.alsv_product_mosaic:main"
alsv_flowacc = "airborne_ls.scripts.alsv_flowacc:main"

[tool.hatch.version]
path = "src/airborne_ls/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true
